
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cube Survival 3D - FBX</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#101522;font-family:Arial,sans-serif;color:white}
canvas{display:block}

#hud{
 position:absolute;top:18px;left:18px;z-index:5;
 display:flex;gap:12px;flex-wrap:wrap
}
.panel{
 background:#111b2bdd;border:1px solid #ffffff25;
 padding:12px 18px;border-radius:12px;min-width:115px;
 backdrop-filter:blur(8px)
}
.panel small{display:block;color:#aab7ca;font-size:11px;margin-bottom:5px}
.panel strong{font-size:22px}

#difficulty{
 position:absolute;top:18px;right:18px;
 background:#111b2bdd;padding:12px 18px;
 border-radius:12px;text-align:right
}
#difficulty small{display:block;color:#aab7ca;margin-bottom:5px}
#difficulty strong{color:#ffcf70}

#help{
 position:absolute;bottom:18px;left:50%;
 transform:translateX(-50%);
 background:#111b2bdd;padding:12px 20px;
 border-radius:12px;text-align:center;
 color:#dce7f8;font-size:13px;white-space:nowrap
}

#message{
 position:absolute;inset:0;z-index:10;
 display:flex;align-items:center;justify-content:center;
 background:#080d18cc
}
#message.hidden{display:none}
.dialog{
 background:#18243a;border:1px solid #ffffff30;
 border-radius:20px;padding:35px;text-align:center;
 width:min(430px,90%)
}
.dialog h1{font-size:34px;margin-bottom:12px}
.dialog p{color:#bdc9dc;line-height:1.6;margin-bottom:20px}
button{
 border:0;background:#27c58b;color:#06291e;
 padding:13px 30px;border-radius:10px;
 font-weight:bold;font-size:16px;cursor:pointer
}
button:hover{background:#56e6b0}
#loading{color:#7deac0;font-size:13px;margin-top:15px}
</style>
</head>

<body>

<div id="hud">
 <div class="panel">
  <small>TIEMPO</small>
  <strong id="time">0.0 s</strong>
 </div>
 <div class="panel">
  <small>PUNTUACIÓN</small>
  <strong id="score">0</strong>
 </div>
 <div class="panel">
  <small>RÉCORD</small>
  <strong id="best">0</strong>
 </div>
</div>

<div id="difficulty">
 <small>DIFICULTAD</small>
 <strong id="level">Nivel 1</strong>
</div>

<div id="help">
 WASD: Moverse | SPACE: Saltar | SHIFT: Correr | R: Reiniciar
</div>

<div id="message">
 <div class="dialog">
  <h1 id="title">CUBE SURVIVAL</h1>
  <p id="description">
   Sobrevive en la plataforma 10 × 10.<br>
   Esquiva los bloques y salta para evitar obstáculos.<br>
   ¡No caigas al vacío!
  </p>
  <button id="start" disabled>CARGANDO PERSONAJE...</button>
  <div id="loading">Cargando modelos y animaciones FBX...</div>
 </div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
 }
}
</script>

<script type="module">

import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

// =====================================
// CONFIGURACIÓN GENERAL
// =====================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9eb7d2);
scene.fog = new THREE.Fog(0x9eb7d2,17,38);

const camera = new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,.1,100
);
camera.position.set(0,8,12);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

// =====================================
// ILUMINACIÓN
// =====================================

scene.add(new THREE.HemisphereLight(0xe6f2ff,0x34445c,2));

const sun = new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(-5,12,8);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-12;
sun.shadow.camera.right=12;
sun.shadow.camera.top=12;
sun.shadow.camera.bottom=-12;
scene.add(sun);

// =====================================
// PISO INFERIOR
// =====================================

const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({color:0x172235})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-9;
scene.add(ground);

// =====================================
// PLATAFORMA 10 X 10
// =====================================

const platform = new THREE.Group();
scene.add(platform);

const tileMaterials=[
 new THREE.MeshStandardMaterial({color:0x334b68}),
 new THREE.MeshStandardMaterial({color:0x3d5878})
];

for(let x=0;x<10;x++){
 for(let z=0;z<10;z++){
  const tile=new THREE.Mesh(
   new THREE.BoxGeometry(.98,.25,.98),
   tileMaterials[(x+z)%2]
  );
  tile.position.set(x-4.5,-.15,z-4.5);
  tile.receiveShadow=true;
  platform.add(tile);
 }
}

const borderMat=new THREE.MeshStandardMaterial({
 color:0x27d9ad,metalness:.35,roughness:.35
});

function border(x,z,sx,sz){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(sx,.15,sz),borderMat
 );
 m.position.set(x,-.02,z);
 platform.add(m);
}

border(0,-5.03,10.3,.18);
border(0,5.03,10.3,.18);
border(-5.03,0,.18,10.3);
border(5.03,0,.18,10.3);

// =====================================
// PERSONAJE FBX
// =====================================

const player = new THREE.Group();
scene.add(player);

let character=null;
let mixer=null;

const actions={};
let currentAction=null;
let characterReady=false;

const loader=new FBXLoader();

const MODEL_PATH='./models/character/';

function loadFBX(path){
 return loader.loadAsync(MODEL_PATH+path);
}

function prepareCharacter(fbx){

 character=fbx;

 // Escala inicial: ajustar si el modelo es demasiado grande o pequeño.
 character.scale.setScalar(.01);

 character.traverse(child=>{
  if(child.isMesh){
   child.castShadow=true;
   child.receiveShadow=true;

   if(child.material){
    const materials=Array.isArray(child.material)
     ? child.material:[child.material];

    materials.forEach(mat=>{
     if(mat.map)mat.map.colorSpace=THREE.SRGBColorSpace;
     mat.needsUpdate=true;
    });
   }
  }
 });

 // Centrar el modelo horizontalmente y apoyar sus pies en el suelo.
 const box=new THREE.Box3().setFromObject(character);
 const center=new THREE.Vector3();
 box.getCenter(center);

 character.position.x-=center.x;
 character.position.z-=center.z;
 character.position.y-=box.min.y;

 player.add(character);

 // Orientación: el modelo mira hacia los obstáculos.
 character.rotation.y=Math.PI;

 mixer=new THREE.AnimationMixer(character);
}

// =====================================
// CARGAR ANIMACIONES MIXAMO
// =====================================

function createAction(name,fbx){

 if(!fbx.animations || !fbx.animations.length){
  console.warn('No se encontró animación en:',name);
  return;
 }

 const clip=fbx.animations[0];

 // Eliminar desplazamiento horizontal de la animación,
 // para que el movimiento lo controle el videojuego.
 clip.tracks=clip.tracks.filter(track=>{
  return !(
   track.name.endsWith('.position') &&
   track.name.toLowerCase().includes('hips')
  );
 });

 const action=mixer.clipAction(clip);
 action.enabled=true;
 action.setEffectiveWeight(1);

 actions[name]=action;
}

function changeAnimation(name,fade=.18){

 if(!actions[name] || currentAction===name)return;

 const next=actions[name];

 if(currentAction && actions[currentAction]){
  const previous=actions[currentAction];
  next.reset();
  next.setEffectiveTimeScale(1);
  next.play();
  previous.crossFadeTo(next,fade,false);
 }else{
  next.reset();
  next.play();
 }

 currentAction=name;
}

// =====================================
// CARGA DE MODELO Y ANIMACIONES
// =====================================

async function loadCharacter(){

 try{

  const [model,walking,running,jumping]=await Promise.all([
   loadFBX('character.fbx'),
   loadFBX('Walking.fbx'),
   loadFBX('Fast Run.fbx'),
   loadFBX('Jumping.fbx')
  ]);

  prepareCharacter(model);

  createAction('walk',walking);
  createAction('run',running);
  createAction('jump',jumping);

  // Utilizamos caminar a velocidad casi cero como pose de reposo.
  if(actions.walk){
   actions.idle=actions.walk;
   actions.idle.setEffectiveTimeScale(.001);
   changeAnimation('idle',0);
  }

  characterReady=true;

  document.getElementById('start').disabled=false;
  document.getElementById('start').textContent='COMENZAR';
  document.getElementById('loading').textContent='¡Personaje cargado correctamente!';

 }catch(error){

  console.error('Error cargando FBX:',error);

  document.getElementById('loading').textContent=
   'Error al cargar los FBX. Revisa los nombres y las rutas de los archivos.';

  document.getElementById('start').textContent='REINTENTAR CARGA';
  document.getElementById('start').disabled=false;
 }
}

loadCharacter();

// =====================================
// OBSTÁCULOS
// =====================================

const obstacles=[];

const obstacleMaterials=[
 new THREE.MeshStandardMaterial({color:0xff4d55}),
 new THREE.MeshStandardMaterial({color:0xff9e37}),
 new THREE.MeshStandardMaterial({color:0xa75bff})
];

function spawnRow(){

 const level=Math.floor(elapsed/15);
 const count=Math.min(9,2+Math.floor(level*.8));
 const safeCount=Math.max(1,10-count);

 const lanes=Array.from({length:10},(_,i)=>i);

 for(let i=lanes.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [lanes[i],lanes[j]]=[lanes[j],lanes[i]];
 }

 const safe=lanes.slice(0,safeCount);

 for(let lane=0;lane<10;lane++){

  if(safe.includes(lane))continue;

  const cube=new THREE.Mesh(
   new THREE.BoxGeometry(.88,.88,.88),
   obstacleMaterials[Math.floor(Math.random()*obstacleMaterials.length)]
  );

  cube.position.set(lane-4.5,.48,-5.65);
  cube.castShadow=true;
  cube.receiveShadow=true;

  const edges=new THREE.LineSegments(
   new THREE.EdgesGeometry(cube.geometry),
   new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.5})
  );

  cube.add(edges);
  scene.add(cube);
  obstacles.push(cube);
 }
}

// =====================================
// VARIABLES DEL JUEGO
// =====================================

let running=false;
let lost=false;
let elapsed=0;
let score=0;
let best=Number(localStorage.getItem('cubeBest')||0);

let speed=3;
let spawnTimer=0;
let spawnInterval=2.2;

let verticalVelocity=0;
let onGround=true;

const keys={};

const clock=new THREE.Clock();

const timeUI=document.getElementById('time');
const scoreUI=document.getElementById('score');
const bestUI=document.getElementById('best');
const levelUI=document.getElementById('level');
const message=document.getElementById('message');

bestUI.textContent=best;

// =====================================
// CONTROLES
// =====================================

window.addEventListener('keydown',e=>{

 keys[e.code]=true;

 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)){
  e.preventDefault();
 }

 if(e.code==='Space'&&running&&onGround){
  verticalVelocity=8;
  onGround=false;
  changeAnimation('jump',.1);
 }

 if(e.code==='KeyR'&&characterReady){
  restart();
 }

});

window.addEventListener('keyup',e=>{
 keys[e.code]=false;
});

// =====================================
// REINICIAR
// =====================================

function restart(){

 if(!characterReady)return;

 obstacles.forEach(o=>scene.remove(o));
 obstacles.length=0;

 player.position.set(0,0,0);

 elapsed=0;
 score=0;
 speed=3;
 spawnTimer=0;
 spawnInterval=2.2;

 verticalVelocity=0;
 onGround=true;

 lost=false;
 running=true;

 changeAnimation('idle',.1);

 message.classList.add('hidden');

 clock.getDelta();
 updateHUD();
}

// =====================================
// HUD
// =====================================

function updateHUD(){

 timeUI.textContent=elapsed.toFixed(1)+' s';
 scoreUI.textContent=score;
 levelUI.textContent='Nivel '+(Math.floor(elapsed/15)+1);
 bestUI.textContent=best;
}

// =====================================
// MOVIMIENTO DEL PERSONAJE
// =====================================

function movePlayer(dt){

 let dx=0,dz=0;

 if(keys.KeyW||keys.ArrowUp)dz-=1;
 if(keys.KeyS||keys.ArrowDown)dz+=1;
 if(keys.KeyA||keys.ArrowLeft)dx-=1;
 if(keys.KeyD||keys.ArrowRight)dx+=1;

 const moving=dx!==0||dz!==0;

 const length=Math.hypot(dx,dz)||1;
 dx/=length;
 dz/=length;

 const sprint=keys.ShiftLeft||keys.ShiftRight;
 const moveSpeed=sprint?8:5.2;

 player.position.x+=dx*moveSpeed*dt;
 player.position.z+=dz*moveSpeed*dt;

 // Animaciones de movimiento
 if(!onGround){

  if(actions.jump){
   changeAnimation('jump',.1);
  }

 }else if(moving){

  if(sprint){
   changeAnimation('run',.18);
  }else{
   changeAnimation('walk',.18);
  }

 }else{
  changeAnimation('idle',.2);
 }

 // Salto
 if(!onGround){

  verticalVelocity-=19*dt;
  player.position.y+=verticalVelocity*dt;

  if(player.position.y<=0){
   player.position.y=0;
   verticalVelocity=0;
   onGround=true;
  }
 }

 // Orientación hacia el movimiento
 if(moving && character){

  const targetRotation=Math.atan2(dx,dz)+Math.PI;

  // El modelo tiene un giro inicial de PI.
  const normalized=targetRotation;
  const diff=Math.atan2(
   Math.sin(normalized-character.rotation.y),
   Math.cos(normalized-character.rotation.y)
  );

  character.rotation.y+=diff*Math.min(1,dt*10);
 }

 // Caída de plataforma
 if(
  Math.abs(player.position.x)>5.25||
  Math.abs(player.position.z)>5.25
 ){
  endGame('¡CAÍSTE DE LA PLATAFORMA!');
 }
}

// =====================================
// COLISIONES
// =====================================

function updateObstacles(dt){

 for(let i=obstacles.length-1;i>=0;i--){

  const o=obstacles[i];

  o.position.z+=speed*dt;
  o.rotation.x+=dt*.35;
  o.rotation.y+=dt*.55;

  const dx=Math.abs(o.position.x-player.position.x);
  const dz=Math.abs(o.position.z-player.position.z);

  // Altura aproximada del cuerpo.
  const playerCenter=player.position.y+1;
  const obstacleCenter=o.position.y;

  const verticalDistance=Math.abs(playerCenter-obstacleCenter);

  if(
   dx<.78 &&
   dz<.78 &&
   verticalDistance<.9
  ){
   endGame('¡TE GOLPEÓ UN BLOQUE!');
   return;
  }

  if(o.position.z>6){

   scene.remove(o);
   obstacles.splice(i,1);
   score+=10;
  }
 }
}

// =====================================
// CÁMARA TERCERA PERSONA
// =====================================

function updateCamera(dt){

 const desired=new THREE.Vector3(
  player.position.x*.35,
  7.5+player.position.y*.25,
  player.position.z+10
 );

 camera.position.lerp(
  desired,
  1-Math.exp(-4*dt)
 );

 camera.lookAt(
  player.position.x,
  player.position.y+1,
  player.position.z-1
 );
}

// =====================================
// DIFICULTAD PROGRESIVA
// =====================================

function updateDifficulty(){

 const level=Math.floor(elapsed/15);

 speed=Math.min(3+level*.55,9);
 spawnInterval=Math.max(2.2-level*.16,.65);
}

// =====================================
// FIN DE PARTIDA
// =====================================

function endGame(reason){

 if(lost)return;

 lost=true;
 running=false;

 if(elapsed>best){
  best=elapsed;
  localStorage.setItem('cubeBest',best);
 }

 document.getElementById('title').textContent='¡HAS PERDIDO!';

 document.getElementById('description').innerHTML=
  reason+
  '<br><br>Tiempo sobrevivido: <b>'+elapsed.toFixed(1)+
  ' segundos</b><br>Puntuación: <b>'+score+
  '</b><br>Récord: <b>'+best.toFixed(1)+' segundos</b>';

 document.getElementById('start').textContent='VOLVER A JUGAR';

 message.classList.remove('hidden');
 updateHUD();
}

// =====================================
// BOTÓN DE INICIO
// =====================================

document.getElementById('start').addEventListener('click',()=>{

 if(!characterReady){
  loadCharacter();
  return;
 }

 restart();
});

// =====================================
// BUCLE PRINCIPAL
// =====================================

function animate(){

 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);

 if(running){

  elapsed+=dt;

  updateDifficulty();
  movePlayer(dt);

  if(running){

   spawnTimer+=dt;

   if(spawnTimer>=spawnInterval){
    spawnTimer=0;
    spawnRow();
   }

   updateObstacles(dt);
   updateCamera(dt);
   updateHUD();
  }

 }

 if(mixer){
  mixer.update(dt);
 }

 renderer.render(scene,camera);
}

animate();

// =====================================
// REDIMENSIONAR
// =====================================

window.addEventListener('resize',()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
